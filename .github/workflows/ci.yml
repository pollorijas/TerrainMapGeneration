name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar
        run: dotnet build -c Release

      - name: Probar
        run: dotnet test -c Release --no-build

      - name: Ejecutar el proyecto de ejemplo
        run: dotnet run -c Release --no-build --project src/TerrainMapGeneration.Cli -- run samples/projects/default.json
